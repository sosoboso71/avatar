 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { margin: 0; overflow: hidden; background: transparent; }

    #canvas { position: absolute; top: 0; left: 0; }
    #fx { position: absolute; width: 100%; height: 100%; pointer-events: none; }

    /* Avatar mare, pătrat + RAMĂ COLORATĂ (dublu ca mărime) */
    .big-profile {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 30px;
        object-fit: cover;
        border: 14px solid transparent;
        animation: bigProfile 3s ease-out forwards;
    }

    @keyframes bigProfile {
        0% { transform: scale(0.4); opacity: 0; }
        30% { transform: scale(1.10); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
    }

    /* NUME SUB AVATAR MARE */
    .big-name {
        position: absolute;
        font-size: 58px;
        font-weight: 900;
        text-align: center;
        width: 100%;
        left: 0;
        top: calc(50% + 330px);
        color: white;
        text-shadow: 0 0 10px #fff;
        animation: nameFade 3s ease-out forwards;
    }

    @keyframes nameFade {
        0% { opacity: 0; transform: scale(0.8); }
        30% { opacity: 1; transform: scale(1.1); }
        100% { opacity: 0; transform: scale(1.2); }
    }
</style>
</head>

<body>
<canvas id="canvas"></canvas>
<div id="fx"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// DOAR UN AVATAR PER USER
const floatingUsers = new Set();

// LISTA AVATARELOR
let objects = [];

// CACHE POZE PROFIL
const profileCache = {};

function loadProfile(url, callback) {
    if (!url) return;
    if (profileCache[url]) return callback(profileCache[url]);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
        profileCache[url] = img;
        callback(img);
    };
    img.src = url;
}

// UN SINGUR AVATAR PER USER + CERC NEON DIFERIT
function spawnFloatingAvatar(url, uid) {
    if (!url || !uid) return;
    if (floatingUsers.has(uid)) return;

    floatingUsers.add(uid);

    loadProfile(url, (img) => {
        const neonColor = `hsl(${Math.random()*360}, 100%, 50%)`;

        objects.push({
            uid: uid,
            img: img,
            neon: neonColor,
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() * 6 - 3),
            vy: (Math.random() * 6 - 3),
            size: 120
        });
    });
}

// CERC NEON FĂRĂ GLOW
function drawCircleImage(ctx, img, x, y, size, neonColor) {
    ctx.save();

    ctx.beginPath();
    ctx.arc(x, y, size/2 + 5, 0, Math.PI * 2);
    ctx.strokeStyle = neonColor;
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, size/2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, x - size/2, y - size/2, size, size);

    ctx.restore();
}

// RESPINGERE AVATARE
function repelAvatars() {
    for (let i = 0; i < objects.length; i++) {
        for (let j = i + 1; j < objects.length; j++) {
            const a = objects[i];
            const b = objects[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < 140) {
                const angle = Math.atan2(dy, dx);
                const force = 2.5;

                a.vx -= Math.cos(angle) * force;
                a.vy -= Math.sin(angle) * force;

                b.vx += Math.cos(angle) * force;
                b.vy += Math.sin(angle) * force;
            }
        }
    }
}

// MARGINI FĂRĂ TREMURAT
function fixEdges(o) {
    const r = o.size / 2;

    if (o.x < r) {
        o.x = r;
        o.vx *= -1;
    }
    if (o.x > canvas.width - r) {
        o.x = canvas.width - r;
        o.vx *= -1;
    }

    if (o.y < r) {
        o.y = r;
        o.vy *= -1;
    }
    if (o.y > canvas.height - r) {
        o.y = canvas.height - r;
        o.vy *= -1;
    }
}

// LOOP CANVAS — FPS FIX 30
let lastFrame = 0;
const fpsInterval = 1000 / 30;

function loop(ts) {
    if (ts - lastFrame < fpsInterval) {
        requestAnimationFrame(loop);
        return;
    }
    lastFrame = ts;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    repelAvatars();

    for (const o of objects) {
        o.x += o.vx;
        o.y += o.vy;

        fixEdges(o);

        ctx.save();
        ctx.translate(o.x, o.y);
        drawCircleImage(ctx, o.img, 0, 0, o.size, o.neon);
        ctx.restore();
    }

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// EXTRAGERE POZĂ PROFIL
function getProfileUrl(data) {
    return data.profilePictureUrl ||
           data.userDetails?.profilePictureUrls?.[0] ||
           null;
}

// AVATAR MARE + NUME + RAMĂ COLORATĂ
function spawnBigProfile(url, username) {
    if (!url) return;

    const fx = document.getElementById("fx");

    const img = document.createElement("img");
    img.src = url;
    img.className = "big-profile";

    img.style.borderColor = `hsl(${Math.random()*360}, 100%, 50%)`;

    img.style.left = (window.innerWidth/2 - 260) + "px";
    img.style.top = (window.innerHeight/2 - 260) + "px";
    fx.appendChild(img);

    const name = document.createElement("div");
    name.className = "big-name";
    name.innerText = username;
    fx.appendChild(name);

    setTimeout(() => {
        img.remove();
        name.remove();
    }, 3000);
}

// WEBSOCKET INDOFINITY
const ws = new WebSocket("ws://localhost:62024");

ws.onmessage = (event) => {
    let packet;
    try { packet = JSON.parse(event.data); } catch(e) { return; }

    const data = packet.data || {};

    const uid = data.secUid || data.userId || data.uniqueId;
    const profileUrl = getProfileUrl(data);
    const username = data.nickname || data.uniqueId || "User";

    if (!uid) return;

    if (packet.event === "like") {
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }

    if (packet.event === "chat") {
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }

    if (packet.event === "member") {
        spawnBigProfile(profileUrl, username);
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }

    if (packet.event === "gift") {
        spawnBigProfile(profileUrl, username);
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }
};
</script>

</body>
</html>
